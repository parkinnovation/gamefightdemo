<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Fight Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section id="character-select" class="screen active">
      <h1>Game Fight</h1>
      <p class="subtitle">Choose your fighter</p>
      <div class="mode-switch">
        <button id="mode-cpu" class="mode-option active">Human vs CPU</button>
        <button id="mode-cpu-duel" class="mode-option">CPU vs CPU</button>
        <button id="mode-online" class="mode-option">Human vs Human</button>
      </div>
      <div id="online-panel" class="online-panel hidden">
        <div class="room-card">
          <div class="room-title">Online match</div>
          <p id="room-status" class="room-status">Choose a fighter and click Play Online to enter the queue.</p>
          <div class="room-row hidden">
            <input id="room-code-input" class="room-input" type="text" maxlength="12" placeholder="Room code" />
            <button id="join-room" class="secondary">Join room</button>
          </div>
          <div class="room-row room-inline hidden">
            <div class="room-code-wrap">
              <span class="room-label">Internal code</span>
              <strong id="room-code">-</strong>
            </div>
            <button id="copy-room-code" class="secondary" disabled>Copy code</button>
          </div>
        </div>
      </div>
      <div id="character-grid" class="character-grid"></div>
      <button id="start-fight" class="primary" disabled>Start Fight</button>
      <p class="hint">Controls: A/D move, W jump, J punch, K kick</p>
    </section>

    <section id="fight-screen" class="screen">
      <header class="hud">
        <div class="player-side">
          <div id="player-name" class="name">PLAYER</div>
          <div class="bar"><div id="player-health" class="fill"></div></div>
          <div class="rounds" id="player-rounds"></div>
        </div>
        <div class="center-info">
          <div class="label">ROUND</div>
          <div id="round-count" class="value">1</div>
          <div id="timer" class="timer">60</div>
        </div>
        <div class="player-side right">
          <div id="enemy-name" class="name">CPU</div>
          <div class="bar"><div id="enemy-health" class="fill enemy"></div></div>
          <div class="rounds" id="enemy-rounds"></div>
        </div>
      </header>

      <div class="arena-wrap">
        <canvas id="game-canvas" width="1200" height="620"></canvas>
        <div id="overlay-text" class="overlay"></div>
      </div>

      <div id="touch-controls" class="touch-controls" aria-label="Touch controls">
        <div class="touch-cluster movement" aria-label="Movimento">
          <button class="touch-btn dpad-left" data-code="KeyA" type="button" aria-label="Move left">◀</button>
          <button class="touch-btn dpad-right" data-code="KeyD" type="button" aria-label="Move right">▶</button>
        </div>
        <div class="touch-cluster actions" aria-label="Actions">
          <button class="touch-btn action-jump" data-code="KeyW" type="button" aria-label="Jump">A</button>
          <div class="action-row">
            <button class="touch-btn action-hit" data-code="KeyJ" type="button" aria-label="Punch">B</button>
            <button class="touch-btn action-kick" data-code="KeyK" type="button" aria-label="Kick">X</button>
          </div>
        </div>
      </div>

      <button id="back-select" class="secondary">Back to selection</button>
    </section>
  </main>

  <footer class="site-footer">
    <a href="https://www.kyronex.com.br" target="_blank" rel="noopener noreferrer">Powered By Kyronex</a>
    <a href="https://craftpix.net/" target="_blank" rel="noopener noreferrer">Sprites by CraftPix</a>
  </footer>

  <script src="game.js"></script>
</body>
</html>
