<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Fight Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section id="character-select" class="screen active">
      <h1>Game Fight</h1>
      <p class="subtitle">Escolha seu lutador</p>
      <div class="mode-switch">
        <button id="mode-cpu" class="mode-option active">Humano x CPU</button>
        <button id="mode-cpu-duel" class="mode-option">CPU x CPU</button>
        <button id="mode-online" class="mode-option" hidden>Humano x Humano</button>
      </div>
      <div id="online-panel" class="online-panel hidden">
        <div class="room-card">
          <div class="room-title">Partida online</div>
          <p id="room-status" class="room-status">Escolha um lutador e clique em Jogar Online para entrar na fila.</p>
          <div class="room-row hidden">
            <input id="room-code-input" class="room-input" type="text" maxlength="12" placeholder="Código da sala" />
            <button id="join-room" class="secondary">Entrar na sala</button>
          </div>
          <div class="room-row room-inline hidden">
            <div class="room-code-wrap">
              <span class="room-label">Código interno</span>
              <strong id="room-code">-</strong>
            </div>
            <button id="copy-room-code" class="secondary" disabled>Copiar código</button>
          </div>
        </div>
      </div>
      <div id="character-grid" class="character-grid"></div>
      <button id="start-fight" class="primary" disabled>Iniciar Luta</button>
      <p class="hint">Controles: A/D mover, W pular, J soco, K chute</p>
    </section>

    <section id="fight-screen" class="screen">
      <header class="hud">
        <div class="player-side">
          <div id="player-name" class="name">PLAYER</div>
          <div class="bar"><div id="player-health" class="fill"></div></div>
          <div class="rounds" id="player-rounds"></div>
        </div>
        <div class="center-info">
          <div class="label">ROUND</div>
          <div id="round-count" class="value">1</div>
          <div id="timer" class="timer">60</div>
        </div>
        <div class="player-side right">
          <div id="enemy-name" class="name">CPU</div>
          <div class="bar"><div id="enemy-health" class="fill enemy"></div></div>
          <div class="rounds" id="enemy-rounds"></div>
        </div>
      </header>

      <div class="arena-wrap">
        <canvas id="game-canvas" width="1200" height="620"></canvas>
        <div id="overlay-text" class="overlay"></div>
      </div>

      <div id="touch-controls" class="touch-controls" aria-label="Controles de toque">
        <div class="touch-cluster movement">
          <button class="touch-btn wide" data-code="KeyA" type="button">Esquerda</button>
          <button class="touch-btn wide" data-code="KeyD" type="button">Direita</button>
        </div>
        <div class="touch-cluster actions">
          <button class="touch-btn" data-code="KeyW" type="button">Pular</button>
          <button class="touch-btn" data-code="KeyJ" type="button">Soco</button>
          <button class="touch-btn" data-code="KeyK" type="button">Chute</button>
        </div>
      </div>

      <button id="back-select" class="secondary">Voltar para seleção</button>
    </section>
  </main>

  <footer class="site-footer">
    <a href="https://www.kyronex.com.br" target="_blank" rel="noopener noreferrer">Powered By Kyronex</a>
    <a href="https://craftpix.net/" target="_blank" rel="noopener noreferrer">Sprites by CraftPix</a>
  </footer>

  <script src="game.js"></script>
</body>
</html>
